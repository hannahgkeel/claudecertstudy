<title>CCDV-F Mock Exams</title>
<meta name="description" content="Three timed 53-question practice exams for Claude Certified Developer – Foundations, with score reports and answer guides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a calm testing-centre console. One reading column for questions, a sticky navigator rail on wide screens. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #15202b;
  --muted: #586776;
  --line: #d3dae1;
  --accent: #1b6658;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --flag: #a8610a;
  --flag-soft: #fbeedb;
  --ok: #1f7a3a;
  --ok-soft: #e1f2e5;
  --bad: #b02a22;
  --bad-soft: #fbe6e3;
  --focus: #2f7fd0;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #16202a; --surface-2: #1b2632; --ink: #e5ebf0; --muted: #9babba; --line: #2b3946;
    --accent: #5ec3aa; --accent-ink: #08201a; --accent-soft: #173a32; --flag: #f0b45a; --flag-soft: #3a2b12;
    --ok: #6fcf8a; --ok-soft: #163322; --bad: #f28b80; --bad-soft: #3d1c19; --focus: #79b4f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #16202a; --surface-2: #1b2632; --ink: #e5ebf0; --muted: #9babba; --line: #2b3946;
  --accent: #5ec3aa; --accent-ink: #08201a; --accent-soft: #173a32; --flag: #f0b45a; --flag-soft: #3a2b12;
  --ok: #6fcf8a; --ok-soft: #163322; --bad: #f28b80; --bad-soft: #3d1c19; --focus: #79b4f0;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0.05em 0.35em; overflow-wrap: anywhere; }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; font-size: 15px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 14px; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.flag { color: var(--flag); background: var(--flag-soft); border-color: transparent; }
.chip.live { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }

/* Home */
.masthead { display: grid; gap: 12px; padding-block: 8px 28px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.masthead h1 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.01em; }
.masthead p { max-width: 64ch; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.exams { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.exam-card { display: flex; flex-direction: column; gap: 14px; }
.exam-card h2 { font-size: 22px; }
.exam-card .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.section-title { font-size: 20px; margin-top: 40px; margin-bottom: 14px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rubric { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.rubric .panel { display: grid; gap: 8px; }
.rubric h3 { font-size: 16px; }
.rubric ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.band { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-block: 4px; }
.band:last-child { border-bottom: 0; }

/* Exam console */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.topbar .title { display: grid; gap: 2px; min-width: 0; }
.topbar .title strong { font-size: 15px; }
.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; letter-spacing: 0.02em; padding: 2px 10px; border-radius: 6px; }
.timer.low { color: var(--flag); background: var(--flag-soft); }
.timer.out { color: var(--bad); background: var(--bad-soft); }
.progress { height: 4px; background: var(--line); }
.progress span { display: block; height: 100%; background: var(--accent); }
.console { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; margin-top: 20px; }
@media (min-width: 920px) { .console { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } .rail { position: sticky; top: 92px; } }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.qnum { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.stem { font-size: 19px; line-height: 1.6; max-width: 70ch; display: grid; gap: 12px; }
.select-note { font-weight: 700; color: var(--accent); font-size: 15px; }
.options { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--muted); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt .letter { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 14px; color: var(--muted); background: var(--surface-2); }
.opt.multi .letter { border-radius: 6px; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.on .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.locked { opacity: 0.55; cursor: not-allowed; }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.qnav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
.kbd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.cell { position: relative; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 13px; cursor: pointer; color: var(--muted); }
.cell.answered { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.cell.current { outline: 2px solid var(--accent); outline-offset: 1px; color: var(--ink); font-weight: 600; }
.cell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); }
.cell.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.cell.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
.sw.answered { background: var(--accent-soft); border-color: transparent; }
.sw.flagged { background: var(--flag); border-radius: 50%; border-color: transparent; }
.flagbtn.on { color: var(--flag); border-color: var(--flag); background: var(--flag-soft); }
.notice { border-left: 4px solid var(--flag); background: var(--flag-soft); padding: 12px 14px; border-radius: 6px; }

/* Results */
.score-head { display: grid; gap: 18px; }
@media (min-width: 760px) { .score-head { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); align-items: center; } }
.big { font-family: var(--font-mono); font-size: clamp(44px, 9vw, 64px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.scale { position: relative; height: 54px; }
.scale .track { position: absolute; left: 0; right: 0; top: 18px; height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.scale .fill { height: 100%; background: var(--accent); }
.scale .cut { position: absolute; top: 10px; width: 2px; height: 28px; background: var(--ink); }
.scale .cut-label { position: absolute; top: 40px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--ink); white-space: nowrap; }
.scale .end { position: absolute; top: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.dbar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 80px; }
.dbar span { display: block; height: 100%; background: var(--accent); }
.dbar.weak span { background: var(--flag); }
.copybox { width: 100%; min-height: 160px; font-family: var(--font-mono); font-size: 13px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }

/* Guide */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select { font: inherit; font-size: 15px; min-height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; cursor: pointer; font-size: 14px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.gq { display: grid; gap: 14px; }
.gq + .gq { margin-top: 16px; }
.gopts { display: grid; gap: 8px; }
.gopt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.gopt .letter { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.gopt.correct { border-color: var(--ok); background: var(--ok-soft); }
.gopt.correct .letter { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.gopt.picked-wrong { border-color: var(--bad); background: var(--bad-soft); }
.gopt .why { font-size: 15px; color: var(--muted); margin-top: 4px; }
.gopt .tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.explain { border-left: 4px solid var(--accent); padding: 12px 14px; background: var(--accent-soft); border-radius: 6px; font-size: 16px; }
.explain strong { display: block; font-size: 13px; font-family: var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .btn, .opt, .cell { transition: border-color .12s, background-color .12s; } }
</style>
